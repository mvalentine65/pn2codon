[package]
name = "pr2codon"
version = "1.1.21"
edition = "2021"
rust-version = "1.83"
exclude = ["/py_tests"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pr2codon"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "*"
parking_lot = "*"

[profile.release]
lto = true

[profile.dev]
codegen-units = 32
lto = true
opt-level = 3
